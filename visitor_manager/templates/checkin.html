<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>GSA Visitor Check-In</title>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-blue-800 text-center">GSA Visitor Check-In</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium">Full Name</label>
                <input type="text" name="visitor_name" required class="w-full p-2 border rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium">Host Name</label>
                <input type="text" name="host_name" required class="w-full p-2 border rounded">
            </div>
            <div class="mb-4">
                <label class="inline-flex items-center">
                    <input type="checkbox" required class="form-checkbox">
                    <span class="ml-2 text-xs text-gray-600">I accept the GSA Privacy Policy</span>
                </label>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">Check In</button>
        </form>
    </div>
</body>
</html>
